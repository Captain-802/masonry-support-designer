<title>Masonry Support Designer</title>

  Method: BS 5950-1:2000 with SCI P057 / P110 / P157, or Eurocode 3 (UK NA) with SCI P385.
  Engine: engine_js/sms.js (inlined at build).
  Validation: every benchmark run embedded below is recalculated on page load (Validation tab).

<script>
(function () {
  'use strict';
  const SMS = window.SMS;
  const DATA = JSON.parse(document.getElementById('sms-data').textContent);
  const CAT = DATA.catalog;
  const DEG = 180 / Math.PI;
  const $ = id => document.getElementById(id);

  // ------------------------------------------------------------------ formatting
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function mk(s) { // mini markup for symbols: x_{sub}, x^{sup}, x_1, x^2
    return esc(s).replace(/_\{([^}]*)\}/g, '<sub>$1</sub>').replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>')
      .replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>').replace(/\^([0-9])/g, '<sup>$1</sup>');
  }
  function f(v, dp = 2) {
    if (v === Infinity) return '∞';
    if (typeof v !== 'number' || !Number.isFinite(v)) return '—';
    const r = v.toFixed(dp);
    return /^-0(\.0+)?$/.test(r) ? r.slice(1) : r;
  }
  function sci(v, sig = 3) {
    if (!Number.isFinite(v)) return '—';
    if (v === 0) return '0';
    const e = Math.floor(Math.log10(Math.abs(v))), m = v / 10 ** e;
    return `${m.toFixed(sig - 1)}×10<sup>${e}</sup>`;
  }
  const pct = x => (100 * x < 0.0001 && x > 0 ? '<0.0001' : (100 * x).toFixed(4)) + ' %';
  const r6 = x => Math.round(x * 1e6) / 1e6;

  // ------------------------------------------------------------------ BS 5950 Table 13 (compression flange laterally restrained, nominal torsional restraint)
  const TABLE13 = {
    both_full: ['Both flanges fully restrained against rotation on plan', 0.7, 0.85],
    comp_full: ['Compression flange fully restrained against rotation on plan', 0.75, 0.9],
    both_partial: ['Both flanges partially restrained against rotation on plan', 0.8, 0.95],
    comp_partial: ['Compression flange partially restrained against rotation on plan', 0.85, 1.0],
    both_free: ['Both flanges free to rotate on plan', 1.0, 1.2],
  };
  const autoKLT = s => TABLE13[s.restraint][s.destab ? 2 : 1];
  const T13_SHORT = { both_full: 'Both flanges fully restrained', comp_full: 'Compression flange fully restrained',

  function mbFromCat(fam, name) {

  function formToP(s) {

        return { label: String(r.label || '').trim(), w };
      });

      p = SMS.direct.apply(p, which, { G: G.map(r => r.w), Q: Q.map(r => r.w) });   // kN/m = N/mm
      p['direct_' + which] = { G, Q };
    };
    if (dSB) direct('sb', 'G_sb', 'Q_sb', 'Load on the support member');
    if (dMB) direct('mb', 'G_mb', 'Q_mb', 'Load on the torsion beam');
    if (p.sb_load === 'Slab') Object.assign(p, { PG_ssb: num('PG_ssb'), PQ_ssb: num('PQ_ssb'), d_ssb: num('d_ssb') });
    if (p.mb_load === 'Slab') Object.assign(p, { PG_smb: num('PG_smb'), PQ_smb: num('PQ_smb'), d_smb: num('d_smb'), e2: num('e2') });
    if (tor && m === 'Cantilever') p.h_bf = num('h_bf');
    const sls = () => ({                                     // switched-off SLS checks keep their (hidden) limits
      twist_on: s.twist_on ? 1 : 0, defl_on: s.defl_on ? 1 : 0, twist_check: s.twist_check,
      phi_lim: s.twist_check === 'Lever' ? 1 : s.twist_on ? pos('phi_lim') : (Number(s.phi_lim) || 1),
      k_delta: s.defl_on ? pos('k_delta') : (Number(s.k_delta) || 360), d_lim_abs: s.defl_on ? pos('d_lim_abs') : (Number(s.d_lim_abs) || 3),
      d_add: s.defl_on ? num('d_add') : 0,
    });
    if (m === 'Plate') Object.assign(p, { lh: pos('lh'), lplate: pos('lplate'), tsb: pos('tsb') });
    else if (m === 'Cantilever') {
      if (angUser(s)) {
        const D0 = pos('ang_D'), B0 = pos('ang_B'), t = pos('ang_t'), r1 = num('ang_r1'), r2 = num('ang_r2');
        const D = Math.max(D0, B0), B = Math.min(D0, B0), g = SMS.sections.angle(D, B, t, r1, r2);
        p.angle = { name: `User angle ${f(D, 0)}x${f(B, 0)}x${f(t, 1)}`, D, B, t, r1, r2, A: g.A, cyy: g.cy, cx: g.cx };
      } else {

        if (!a) errs.push('Choose an angle.');
        else p.angle = { name: a.name, D: a.D, B: a.B, t: a.t, r1: a.r1, r2: a.r2, A: a.A, cyy: a.cy, cx: a.cx };

    } else Object.assign(p, { lh: pos('ss_lh'), lv: pos('ss_lv'), tsb: pos('ss_t'), r1sb: num('ss_r1') });

    if (m === 'SCI' && fx === 'Bolt' && (p.Bbolt < 300 || p.Bbolt > 1200)) errs.push('Bolt spacing must be 300–1200 mm for the stainless angle.');

  // ------------------------------------------------------------------ form rendering
  const form = $('form');
  // section and angle lists, smallest first (the beam-v03 library lists the I and C sections largest first)
  const sizeOf = name => (String(name).match(/\d+(?:\.\d+)?/g) || []).map(Number);
  const bySize = (a, b) => { const x = sizeOf(a), y = sizeOf(b); for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };

  const angNames = () => (CAT[st.angle_family] || []).map(x => x.name).sort(bySize);
  const lastPick = {};                                                  // last section / angle chosen per type
  // the list member nearest in size to the previous choice (depth first, then the lightest), else the middle one
  function nearest(names, prev) {

  function optionsFor(fd) {

  // one row per load: description, value, unit, remove. Rebuilt on add / remove / load-type change, never while typing.

    if (k === 'angle_family') lastPick[st.angle_family] = st.angle_name;
    const d = FIELD[k];
    if (d.kind === 'num') st[k] = t.value.trim() === '' ? NaN : Number(t.value);
    else if (d.kind === 'chk') st[k] = t.checked;
    else st[k] = t.value;
    if (e.type === 'change' && (k === 'mb_family' || k === 'angle_family' || k === 'sb_method' || k === 'design_method' || k === 'code' || k === 'sb_load' || k === 'mb_load')) {
      if (k === 'code') {
        const bs = [1.4, 1.6], ec = [1.35, 1.5], [from, to] = isEC(st) ? [bs, ec] : [ec, bs];
        if (+st.gG === from[0] && +st.gQ === from[1]) { st.gG = to[0]; st.gQ = to[1]; }
      }
      if (k === 'mb_family' || k === 'code') fixSection();
      if (k === 'angle_family' && !angUser(st)) { const l = angNames(); if (l.length && !l.includes(st.angle_name)) st.angle_name = l.includes(lastPick[st.angle_family]) ? lastPick[st.angle_family] : nearest(l, st.angle_name); }
      writeForm();
    } else syncForm();
    $('preset').value = '';
    schedule();
  }
  // keep the torsion-beam choice valid for the active code (section catalogue for BS, beam-v03 library for EC)
  function fixSection() {
    if (isEC(st)) {
      if (mbUser(st)) st.mb_family = 'UKPFC';
      const hit = EC3MS.find(st.mb_family, st.mb_name), back = EC3MS.find(st.mb_family, lastPick[st.mb_family] || '');
      st.mb_name = hit ? hit.name : back ? back.name : nearest(mbNames(), st.mb_name);
    } else if (!mbUser(st)) {
      const l = CAT[st.mb_family] || [];
      if (l.length && !l.some(x => x.name === st.mb_name)) {
        const h = l.find(x => normName(x.name) === normName(st.mb_name)), back = l.find(x => x.name === lastPick[st.mb_family]);
        st.mb_name = h ? h.name : back ? back.name : nearest(mbNames(), st.mb_name);
      }
    }
  }
  let timer = 0;
  function schedule() { clearTimeout(timer); timer = setTimeout(update, isEC(st) ? 150 : 60); }

  // ------------------------------------------------------------------ results
  let lastP = null, lastO = null;
  function update() {
    const { p, errs, warns } = formToP(st);
    if (isEC(st)) return updateEC(p, errs, warns);
    const msgs = errs.map(t => ['err', t]).concat(warns.map(t => ['warn', t]));
    if (p.direct_sb || p.direct_mb) msgs.push(['info', 'Direct loads: the calculation sheet lists each load and its totals G and Q in place of the leaf height and density, and uses the totals in the formulas; the results are those of a wall of the same weight.']);
    if (p.mirror) msgs.push(['info', 'Mirrored channel: the method is applied with the shear centre on the inner side (levers + B − t + 2e_{0}).']);
    let o = null;
    if (!errs.length) {
      try { o = SMS.calc(p); } catch (e) { msgs.unshift(['err', `The calculation stopped: ${e.message}`]); }
    }
    $('msgs').innerHTML = msgs.map(([c, t]) => `<div class="msg ${c}">${mk(t)}</div>`).join('');
    if (!o) {
      $('verdict').className = 'verdict na';
      $('verdict').innerHTML = '<div class="state">Waiting</div><div><h2>Fix the inputs above to see results</h2></div>';
      return;
    }
    lastP = p; lastO = o;
    const checks = checkList(p, o);
    renderVerdict(p, o, checks);
    renderUtil(checks);
    renderDrawing(p, o);
    renderCalcSheet(p, o);
    renderSection(p, o);
    renderNotes(p, o);
  }

  function state(u) { return !Number.isFinite(u) ? 'na' : u <= 1 ? 'ok' : 'ng'; }
  function renderVerdict(p, o, checks, keys) {
    const bad = checks.filter(c => state(c.u) === 'ng'), na = checks.filter(c => state(c.u) === 'na');
    const gov = checks.filter(c => Number.isFinite(c.u)).reduce((a, c) => (!a || c.u > a.u ? c : a), null);
    const v = $('verdict');
    if (na.length) {
      v.className = 'verdict na';
      v.innerHTML = `<div class="state">Incomplete</div><div><h2>${na.length} check${na.length > 1 ? 's' : ''} could not be completed</h2><p>${esc(na.map(c => c.name).join(', '))}. See the calculation sheet.</p></div>`;
    } else if (bad.length) {
      v.className = 'verdict ng';
      v.innerHTML = `<div class="state">Fails</div><div><h2>${bad.length} of ${checks.length} checks fail</h2><p>${bad.map(c => `${esc(c.name)} <b>${f(c.u, 2)}</b>`).join(' · ')}</p></div>`;
    } else {
      v.className = 'verdict ok';
      v.innerHTML = `<div class="state">Passes</div><div><h2>All ${checks.length} checks pass</h2><p>Governing: ${esc(gov.name)}, utilisation <b>${f(gov.u, 3)}</b></p></div>`;
    }
    const tor = p.design_method === 'Masonry support and torsion', K = keys || [];
    if (keys) { $('keys').innerHTML = K.map(([a, b]) => `<div><dt>${mk(a)}</dt><dd>${b}</dd></div>`).join(''); return; }
    K.push([p.sb_load === 'Slab' ? 'Slab edge load P₁ (ULS)' : 'Outer leaf load P₁ (ULS)', f(o.P1, 2) + ' kN/m']);
    if (tor) {
      K.push(['Torque T_q (ULS)', f(o.Tq / 1e6, 2) + ' kNm']);
      if (o.slender) K.push(['Section class', 'Slender']);
      else {
        K.push(['Twist φ (SLS)', f(o.phi_sls_deg, 2) + '°']);
        K.push(['Deflection δ_y (SLS)', f(o.dy, 2) + ' mm']);
        K.push(['Interaction i_b', f(o.ib, 3)]);
      }
    } else {
      K.push(['Stress at heel', f(o.sigma_heel, 1) + ' N/mm²']);
      K.push(['Toe deflection', f(o.delta_toe, 2) + ' mm']);
    }
    $('keys').innerHTML = K.map(([a, b]) => `<div><dt>${mk(a)}</dt><dd>${b}</dd></div>`).join('');
  }

  function renderUtil(checks) {
    const rows = checks.map(c => {
      const s = state(c.u), w = Number.isFinite(c.u) ? Math.min(c.u / 1.25, 1) * 100 : 0;
      const cls = !Number.isFinite(c.u) ? '' : c.u > 1 ? 'over' : c.u > 0.9 ? 'near' : '';
      return `<tr><td>${esc(c.name)}<span class="ref">${mk(c.ref)}</span></td><td style="width:26%"><div class="bar ${cls}"><i style="width:${w.toFixed(1)}%"></i></div></td>` +
        `<td class="n">${f(c.u, 3)}</td><td><span class="res ${s}">${s === 'ok' ? 'PASS' : s === 'ng' ? 'FAIL' : 'N/A'}</span></td></tr>`;
    }).join('');
    $('util').innerHTML = `<thead><tr><th>Check</th><th>Utilisation</th><th class="n">Ratio</th><th>Result</th></tr></thead><tbody>${rows}</tbody>`;
  }

  // ------------------------------------------------------------------ cross-section drawing (x outward to the cavity, y up from the beam soffit)
  function renderDrawing(p, o) {
    const tor = p.design_method === 'Masonry support and torsion', m = p.sb_method, s = p.fixing === 'Bolt' ? p.shim : 0;
    const back = [], mid = [], front = [];
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    const ext = (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); };
    const P = (x, y) => `${x.toFixed(2)},${(-y).toFixed(2)}`;
    const poly = (pts, cls, layer = mid) => { pts.forEach(q => ext(q[0], q[1])); layer.push(`<polygon class="${cls}" points="${pts.map(q => P(q[0], q[1])).join(' ')}"/>`); };
    const rect = (xa, ya, xb, yb, cls, layer) => poly([[xa, ya], [xb, ya], [xb, yb], [xa, yb]], cls, layer);
    let D = 0, B = 0, xsc = 0, ysc = 0;
    if (tor) {
      const mb = p.mb, t = mb.t, T = mb.T;
      D = mb.D; B = mb.B;
      if (mb.type === 'C' && p.mirror) { poly([[-B, 0], [0, 0], [0, T], [-B + t, T], [-B + t, D - T], [0, D - T], [0, D], [-B, D]], 'stl'); xsc = -B + t / 2 - o.e0mb; }
      else if (mb.type === 'C') { poly([[0, 0], [-B, 0], [-B, T], [-t, T], [-t, D - T], [-B, D - T], [-B, D], [0, D]], 'stl'); xsc = -t / 2 + o.e0mb; }
      else if (mb.type === 'I') {
        const a = -B / 2 - t / 2, b = -B / 2 + t / 2;
        poly([[-B, 0], [0, 0], [0, T], [b, T], [b, D - T], [0, D - T], [0, D], [-B, D], [-B, D - T], [a, D - T], [a, T], [-B, T]], 'stl'); xsc = -B / 2;
      } else {
        ext(-B, 0); ext(0, D);
        mid.push(`<path class="stl" fill-rule="evenodd" d="M${P(-B, 0)} L${P(0, 0)} L${P(0, D)} L${P(-B, D)} Z M${P(-B + t, t)} L${P(-t, t)} L${P(-t, D - t)} L${P(-B + t, D - t)} Z"/>`);
        xsc = -B / 2;
      }
      ysc = D / 2;
    }
    let heel = 0, toe = 0, ybear = 0, lv = 0;
    if (m === 'Plate') { rect(-(p.lplate - p.lh), -p.tsb, p.lh, 0, 'stl'); toe = p.lh; }
    else {
      let lh, t, r = 0;
      if (m === 'Cantilever') { const lg = (p.orientation || 'Long') === 'Long'; lh = lg ? p.angle.D : p.angle.B; lv = lg ? p.angle.B : p.angle.D; t = p.angle.t; }
      else { lh = p.lh; lv = p.lv; t = p.tsb; r = p.r1sb; }
      heel = s; toe = s + lh; ybear = t;
      if (!tor) rect(-70, -60, 0, Math.max(lv, 150) + 170, 'wall', back);
      if (r > 0) {
        const R = r + t, pts = [[s, lv]], n = 10;
        for (let i = 0; i <= n; i++) { const a = Math.PI + i / n * Math.PI / 2; pts.push([s + R + R * Math.cos(a), R + R * Math.sin(a)]); }
        pts.push([s + lh, 0], [s + lh, t]);
        for (let i = 0; i <= n; i++) { const a = 1.5 * Math.PI - i / n * Math.PI / 2; pts.push([s + R + r * Math.cos(a), R + r * Math.sin(a)]); }
        pts.push([s + t, lv]);
        poly(pts, 'stl');
      } else poly([[s, 0], [s + lh, 0], [s + lh, t], [s + t, t], [s + t, lv], [s, lv]], 'stl');
      if (s > 0) rect(0, 0, s, lv, 'shim');
      if (p.fixing === 'Bolt') {
        const d = Number(p.bolt_size.slice(1)), yb = lv - p.eb;
        rect(tor ? -Math.min(30, B * 0.3) : -40, yb - d / 2, s + t + 0.9 * d, yb + d / 2, 'bolt', front);
      }
    }
    const emb = tor ? p.e_mb : 0, xo = p.c - emb, top = Math.max(D, lv) + 150, hO = top - ybear;
    const leaf = (xa, ya, xb, yb) => {
      const w = xb - xa, a = Math.min(12, w / 8);
      poly([[xa, ya], [xb, ya], [xb, yb], [xa + 0.62 * w, yb], [xa + 0.54 * w, yb + a], [xa + 0.46 * w, yb - a], [xa + 0.38 * w, yb], [xa, yb]], 'mas', back);
    };
    const slabS = p.sb_load === 'Slab', slabM = tor && p.mb_load === 'Slab';
    if (slabS) rect(heel + (m === 'Plate' ? 0 : ybear) + 4, ybear, Math.max(toe, heel + p.e1) + 70, ybear + p.d_ssb, 'slab', back);
    else leaf(xo, ybear, xo + p.b_msb, ybear + hO);
    if (slabM) rect(-B - 70, D, -emb, D + p.d_smb, 'slab', back);
    else if (tor) leaf(-emb - p.b_mmb, D, -emb, top);
    // scale-dependent annotation
    const W = Math.max(x1 - x0, 260), fs = W / 21, tk = fs * 0.35;
    const txt = (x, y, s2, cls, anchor = 'middle', extra = '') => { ext(x, y); ext(x, y + fs); front.push(`<text class="${cls}" x="${x.toFixed(1)}" y="${(-y).toFixed(1)}" font-size="${fs.toFixed(1)}" text-anchor="${anchor}"${extra}>${s2}</text>`); };
    const dimH = (xa, xb, y, label) => {
      if (!(Math.abs(xb - xa) > 0.5)) return;
      ext(xa, y); ext(xb, y);
      front.push(`<path class="dim" d="M${P(xa, y)} L${P(xb, y)} M${P(xa - tk, y - tk)} L${P(xa + tk, y + tk)} M${P(xb - tk, y - tk)} L${P(xb + tk, y + tk)} M${P(xa, y - 1.5 * tk)} L${P(xa, y + 1.5 * tk)} M${P(xb, y - 1.5 * tk)} L${P(xb, y + 1.5 * tk)}"/>`);
      txt((xa + xb) / 2, y + 0.35 * fs, label, 'dimt');
    };
    const arrow = (x, ya, yb, label) => {
      ext(x, ya); ext(x, yb);
      front.push(`<path class="ld" d="M${P(x, ya)} L${P(x, yb)} M${P(x - 0.3 * fs, yb + 0.55 * fs)} L${P(x, yb)} L${P(x + 0.3 * fs, yb + 0.55 * fs)}"/>`);
      txt(x, ya + 0.3 * fs, label, 'ldt');
    };
    const yb = Math.min(m === 'Plate' ? -p.tsb : 0, 0) - 1.4 * fs;
    dimH(xo, toe, yb, `d<tspan baseline-shift="sub" font-size="${(0.7 * fs).toFixed(1)}">m</tspan> ${f(o.dm, 0)}`);
    if (m !== 'SCI') dimH(heel, heel + p.e1, yb - 1.7 * fs, `e<tspan baseline-shift="sub" font-size="${(0.7 * fs).toFixed(1)}">1</tspan> ${f(p.e1, 0)}`);
    const yc = tor ? D + 0.45 * (top - D) : ybear + 0.6 * hO;
    dimH(-emb, xo, yc, `c ${f(p.c, 0)}`);
    const xw1 = slabS ? heel + p.e1 : xo + p.b_msb / 2, yS = ybear + (slabS ? p.d_ssb : 0) + 0.2 * fs;
    if (slabS) arrow(xw1, yS + 2 * fs, yS, 'w₁'); else arrow(xw1, top + 2.4 * fs, top + 0.4 * fs, 'w₁');
    if (tor) {
      const xw2 = slabM ? -p.e2 : -emb - p.b_mmb / 2;
      if (slabM) { const yM = D + p.d_smb + 0.2 * fs; arrow(xw2, yM + 2 * fs, yM, 'w₂'); } else arrow(xw2, top + 2.4 * fs, top + 0.4 * fs, 'w₂');
      const r = 0.42 * fs;
      ext(xsc - r, ysc - r); ext(xsc + r, ysc + r);
      front.push(`<path class="scm" d="M${P(xsc - 1.6 * r, ysc)} L${P(xsc + 1.6 * r, ysc)} M${P(xsc, ysc - 1.6 * r)} L${P(xsc, ysc + 1.6 * r)}"/><circle class="scm" cx="${xsc.toFixed(2)}" cy="${(-ysc).toFixed(2)}" r="${r.toFixed(2)}"/>`);
      txt(xsc + 0.8 * fs, ysc + 0.6 * fs, 'SC', 'sct', 'start');
      dimH(xsc, xw1, top + 3.9 * fs, `e<tspan baseline-shift="sub" font-size="${(0.7 * fs).toFixed(1)}">1mb</tspan> ${f(o.e1mb, 0)}`);
      dimH(xw2, xsc, top + 5.6 * fs, `e<tspan baseline-shift="sub" font-size="${(0.7 * fs).toFixed(1)}">2mb</tspan> ${f(o.e2mb, 0)}`);
    }
    const lx = slabS ? Math.max(toe, heel + p.e1) + 35 : xo + p.b_msb / 2, ly = slabS ? ybear + 0.1 * p.d_ssb : ybear + 0.3 * hO;
    if (!slabS) front.push(`<text class="lft" x="${lx.toFixed(1)}" y="${(-ly).toFixed(1)}" font-size="${(0.8 * fs).toFixed(1)}" text-anchor="start" transform="rotate(-90 ${lx.toFixed(1)} ${(-ly).toFixed(1)})" dy="${(0.3 * fs).toFixed(1)}">outer leaf ${f(p.b_msb, 0)}</text>`);
    else txt(lx, ly + 0.45 * p.d_ssb, 'slab', 'lft');
    if (slabM) txt(-B / 2, D + 0.35 * p.d_smb, 'slab', 'lft');
    else if (tor) { const ix = -emb - p.b_mmb / 2, iy = D + 0.08 * (top - D); front.push(`<text class="lft" x="${ix.toFixed(1)}" y="${(-iy).toFixed(1)}" font-size="${(0.8 * fs).toFixed(1)}" text-anchor="start" transform="rotate(-90 ${ix.toFixed(1)} ${(-iy).toFixed(1)})" dy="${(0.3 * fs).toFixed(1)}">inner leaf ${f(p.b_mmb, 0)}</text>`); }
    const pad = fs * 0.8, vb = [x0 - pad, -(y1 + pad), x1 - x0 + 2 * pad, y1 - y0 + 2 * pad].map(v => v.toFixed(1)).join(' ');
    const defs = `<defs><pattern id="mas" patternUnits="userSpaceOnUse" width="300" height="75"><rect width="300" height="75" style="fill:var(--brick-fill)"/><rect y="0" width="300" height="10" style="fill:var(--mortar)"/></pattern>` +
      `<pattern id="hatch" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)"><rect width="14" height="14" style="fill:var(--surface-2)"/><line x1="0" y1="0" x2="0" y2="14" style="stroke:var(--hatch);stroke-width:1.2"/></pattern></defs>`;
    const title = tor ? `${p.mb.name} with ${m === 'Plate' ? `${f(p.tsb, 0)} mm plate` : m === 'Cantilever' ? p.angle.name : 'stainless angle'}` : (m === 'Cantilever' ? p.angle.name : 'stainless angle');
    $('draw').innerHTML = `<svg class="draw" viewBox="${vb}" role="img" aria-label="Cross-section: ${esc(title)}" preserveAspectRatio="xMidYMid meet">${defs}${back.join('')}${mid.join('')}${front.join('')}</svg>`;
    $('legend').innerHTML = `<span>${esc(title)}</span>` + (tor ? `<span>SC = shear centre of the torsion beam</span>` : '') + '<span>Dimensions in mm</span>';
  }

  // ------------------------------------------------------------------ calculation sheet
  function sheetMeta() {
    return { company: st.company, address: st.address, project: st.project, jobref: st.jobref, section: st.section,
      calcby: st.calcby, calcdate: st.calcdate || new Date().toLocaleDateString(), chkby: st.chkby, chkdate: st.chkdate,
      appby: st.appby, appdate: st.appdate };
  }
  function setPrintPage(paper) {
    let el = document.getElementById('sheet-page');
    if (!el) { el = document.createElement('style'); el.id = 'sheet-page'; document.head.append(el); }
    el.textContent = paper ? `@page{size:${paper === 'A4' ? '210mm 297mm' : '8.5in 11in'};margin:0}` : '';
    document.body.classList.toggle('calc-sheet', !!paper);
  }
  function renderCalcSheet(p, o) {
    const ver = `Masonry Support Designer calculation version ${String(SMS.version).split(' ')[0]}`;
    const items = SMSReport.build(p, o, { versionLine: ver, versionLine2: ver });
    const pages = SheetRender.render(items, sheetMeta(), { paper: st.paper, sketch: SheetSketch.sketch(p, o), sketchGap: SheetSketch.gap(p) });
    $('tab-sheet').innerHTML = `<div class="tpages">${pages.join('')}</div>`;
    setPrintPage(st.paper || 'Letter');
  }

  // ------------------------------------------------------------------ section properties
  function renderSection(p, o) {
    const rows = [], tor = p.design_method === 'Masonry support and torsion';
    const T = (a, b, c) => rows.push(`<tr><td>${mk(a)}</td><td class="n">${b}</td><td>${mk(c || '')}</td></tr>`);
    let html = '';
    if (tor) {
      const mb = p.mb, hr = mb.type === 'HR';
      T('Section', esc(mb.name)); T('Source of properties', esc(mb.source || 'section tables'));
      T('Depth D', f(mb.D, 1), 'mm'); T('Width B', f(mb.B, 1), 'mm'); T(hr ? 'Wall thickness t' : 'Web thickness t', f(mb.t, 2), 'mm');
      if (!hr) { T('Flange thickness T', f(mb.T, 2), 'mm'); T('Root radius r', f(mb.r, 1), 'mm'); }
      T('Area A', f(mb.A / 100, 2), 'cm^2'); T('I_{x}', f(mb.Ix / 1e4, 1), 'cm^4'); T('I_{y}', f(mb.Iy / 1e4, 1), 'cm^4');
      T('Z_{x}', f(mb.Zx / 1e3, 1), 'cm^3'); T('Z_{y}', f(mb.Zy / 1e3, 1), 'cm^3'); T('S_{x}', f(mb.Sx / 1e3, 1), 'cm^3');
      T('r_{y}', f(mb.ry, 2), 'mm'); T('Torsion constant J', f(mb.J / 1e4, 2), 'cm^4');
      if (hr) T('Torsion modulus C', f(mb.C / 1e3, 1), 'cm^3');
      else {
        T('Warping constant H', f(mb.H / 1e12, 4), 'dm^6'); T('Buckling parameter u', f(mb.u, 3)); T('Torsional index x', f(mb.x, 2));
        if (mb.type === 'C') T('Centroid from back of web c_{y}', f(mb.cy, 2), 'mm');
        T('Shear centre from web centreline e_{0}', f(o.e0mb, 2), 'mm'); T('Normalised warping function W_{n0}', f(o.Wn0 / 100, 2), 'cm^2');
        T('Warping statical moment S_{w1}', f(o.Sw1 / 1e4, 1), 'cm^4'); T('First moment Q_{f} (flange)', f(o.Qf / 1e3, 1), 'cm^3');
        T('First moment Q_{w} (web)', f(o.Qw / 1e3, 1), 'cm^3'); T('Torsional bending constant a', f(o.a, 1), 'mm');
      }
      T('Design strength p_{y}', f(o.py, 0), 'N/mm^2'); T('Classification', esc(o.Class));
      html += `<h3 class="sh-h">Torsion beam</h3><div class="scroll"><table><tbody>${rows.join('')}</tbody></table></div>`;
      rows.length = 0;
    }
    if (p.sb_method === 'Cantilever') {
      const a = p.angle;
      T('Angle', esc(a.name)); T('Legs D × B × t', `${f(a.D, 0)} × ${f(a.B, 0)} × ${f(a.t, 1)}`, 'mm'); T('Radii r_{1}, r_{2}', `${f(a.r1, 1)}, ${f(a.r2, 1)}`, 'mm');
      T('Area A', f(a.A / 100, 2), 'cm^2'); T('Centroid from back of long leg c_{yy}', f(a.cyy, 2), 'mm');
      html += `<h3 class="sh-h">Support angle</h3><div class="scroll"><table><tbody>${rows.join('')}</tbody></table></div>`;
      html += '<p class="nt">The method takes the self-weight lever of the angle from c<sub>yy</sub> whatever the orientation (Engineering notes F14).</p>';
    } else if (p.sb_method === 'SCI') {
      T('Legs l_{h} × l_{v} × t', `${f(p.lh, 0)} × ${f(p.lv, 0)} × ${f(p.tsb, 1)}`, 'mm'); T('Inside bend radius r_{1}', f(p.r1sb, 1), 'mm');
      T('Area A_{sbu}', f(o.Asbu, 0), 'mm^2'); T('Back of vertical leg to CoG c_{yysb}', f(o.cyysb, 1), 'mm');
      html += `<h3 class="sh-h">Stainless angle</h3><div class="scroll"><table><tbody>${rows.join('')}</tbody></table></div>`;
    } else {
      T('Plate l_{plate} × t_{sb}', `${f(p.lplate, 0)} × ${f(p.tsb, 1)}`, 'mm'); T('Area A_{sbu}', f(o.Asbu, 0), 'mm^2 per m'); T('Weld line to CoG c_{yysb}', f(o.cyysb, 1), 'mm');
      html += `<h3 class="sh-h">Support plate</h3><div class="scroll"><table><tbody>${rows.join('')}</tbody></table></div>`;
    }
    $('tab-section').innerHTML = html;
  }

  // ------------------------------------------------------------------ engineering notes (method behaviour, with live figures)
  function renderNotes(p, o) {
    const tor = p.design_method === 'Masonry support and torsion', m = p.sb_method, N = [];
    const add = (id, lvl, title, body) => N.push(`<div class="note ${lvl}"><h4><span class="id">${id}</span>${esc(title)}</h4><p>${body}</p></div>`);
    if (tor) {
      const mb = p.mb;
      if (mb.type === 'C') {
        const s = o.P1 * o.e1mb + o.w2ULS * o.e2mb + o.w3ULS * o.e3mb, e4 = (mb.t / 2 - mb.cy) - o.e0mb;
        const tq2 = Math.abs(s + o.w4ULS * e4) * p.L;
        add('F2', 'warn', 'Channel self-weight torque is left out', `The channel's centroid is ${f(Math.abs(e4), 1)} mm inboard of its shear centre, so its own weight twists it. Including it changes the ULS torque from ${f(o.Tq / 1e6, 2)} to ${f(tq2 / 1e6, 2)} kNm (${f(100 * (tq2 / o.Tq - 1), 1)} %). The method leaves it out.`);
      }
      add('F3', 'warn', 'Construction sequence is not checked', 'If the inner leaf is built ahead of the outer leaf, the outer leaf’s balancing torque is missing and the beam twists more than calculated. State a maximum height difference on the drawings or prop the beam.');
      const toeX = m === 'Plate' ? p.lh : (m === 'Cantilever' ? ((p.orientation || 'Long') === 'Long' ? p.angle.D : p.angle.B) : p.lh) + (p.fixing === 'Bolt' ? p.shim : 0);
      const xsc = mb.type === 'C' ? o.e0mb - mb.t / 2 : mb.B / 2;
      const lever = toeX + xsc, drop = o.dy + (o.phi_sls_deg / DEG) * lever + o.delta_toe;
      if (!o.slender) add('F4', 'info', 'Total drop of the outer-leaf bearing is not a check of the method', `Estimate at midspan, toe of the support: δ<sub>y</sub> + φ<sub>sls</sub> × ${f(lever, 0)} mm + δ<sub>toe</sub> = ${f(o.dy, 2)} + ${f((o.phi_sls_deg / DEG) * lever, 2)} + ${f(o.delta_toe, 2)} = <b>${f(drop, 1)} mm</b>. Compare with what the masonry and its movement joints can accept.`);
      add('F6', 'warn', 'End connections must carry the torque', `The twist analysis assumes torsion-fixed ends. Each end connection must resist T<sub>q</sub>/2 = <b>${f(o.Tq / 2e6, 2)} kNm</b> (ULS) as a couple, for example through a full-depth end plate. The method does not design the connections.`);
      if (!st.destab && !st.klt_override) add('F7', 'info', 'Destabilising load is a judgement', 'The inner leaf bears on the top flange. If the flange can move with the load, tick “Destabilising load” (Table 13, second column).');
      if (mb.type !== 'HR') add('F9', 'info', 'Flange ratio for channels', `The method takes b/T with b = B/2 (${f(o.bt, 2)}) for channels too. BS 5950 takes b = B for channels (${f(mb.B / mb.T, 2)}). Check the class by hand if this ratio is near a limit.`);
      if (mb.type === 'C' && mb.source && mb.source === 'section tables') add('F8', 'info', 'UKPFC torsion constants', 'J and H come from the section data used for the benchmarks. They differ slightly from the published section tables (UKPFC 300×100×46: J 36.45 against 36.8 cm⁴), which moves the twist by a few per cent.');
    }
    if (m === 'Plate' || (m === 'Cantilever' && p.fixing === 'Weld top')) {
      if (tor && p.grade_sb !== p.grade_mb) add('F12', 'warn', 'Weld strength uses the support grade only', `p<sub>w</sub> = ${f(o.pweld, 0)} N/mm² comes from the ${esc(p.grade_sb)} support member. The beam is ${esc(p.grade_mb)}: BS 5950 takes the weaker of the parts joined.`);
    }
    if (m === 'Plate') {
      if (o.dm < 2 / 3 * p.b_msb && p.sb_load !== 'Slab') add('F13', 'warn', 'Less than 2/3 bearing', `d<sub>m</sub> = ${f(o.dm, 1)} mm is below 2/3 of the leaf width (${f(2 / 3 * p.b_msb, 1)} mm). The method rejects this for angles but not for plates.`);
      add('F10', 'info', 'Weld model is conservative', `Longitudinal shear assumes the plate at full yield: R<sub>l</sub> = 2R<sub>p</sub>/L = ${f(o.Rl, 0)} kN/m.`);
    }
    if (m !== 'SCI') {
      const b = bearing(st);
      if (p.sb_load !== 'Slab' && Number.isFinite(b.cl) && Math.abs(b.cl - p.e1) > 0.5) add('F5', 'warn', 'e₁ is not at the bearing centreline', `e<sub>1</sub> = ${f(p.e1, 1)} mm but the outer leaf bears centrally at ${f(b.cl, 1)} mm from the heel. e<sub>1</sub> only feeds the support-member checks; the torque uses the leaf centreline. Use the “Use” button next to e<sub>1</sub> unless the load really sits off-centre.`);
    }
    if (m === 'Cantilever' && p.angle.D !== p.angle.B) add('F14', 'info', 'Unequal angle centroid', `The method uses the centroid distance from the back of the long leg (${f(p.angle.cyy, 1)} mm) as the self-weight lever for either orientation. The effect is small.`);
    if (p.fixing === 'Bolt') add('B1', 'info', 'Bolt tension strength', 'Bolt capacities use p<sub>t</sub> = 195 / 450 N/mm² (grade 4.6 / 8.8) the BS 5950-1:1990 values used by the benchmarks. BS 5950-1:2000 Table 34 gives higher values, so this is conservative.');
    if (p.sb_load === 'Slab' || p.mb_load === 'Slab') add('S1', 'info', 'Slab option', `The slab reactions replace the masonry and the extra loads are ignored. The slab edge acts at e<sub>1</sub> from the heel${p.mb_load === 'Slab' ? ', and the slab on the beam at e<sub>2</sub> from the beam face on the cavity side' : ''}; slab depths are recorded but not used. Rules confirmed by benchmark runs (2 Oct 2026).`);
    if (m === 'Cantilever' && tor && (p.h_bf || 0) < 0) add('H1', 'info', 'Angle soffit above the beam soffit', `With h<sub>bf</sub> = ${f(p.h_bf, 0)} mm the method shortens the lever to l = ${f(o.l, 1)} mm and the load arm to a<sub>m</sub> = ${f(o.am, 1)} mm; λ<sub>m</sub> keeps l<sub>b</sub> = ${f(o.lb, 1)} mm. A positive h<sub>bf</sub> changes nothing.`);
    add('F11', 'info', 'Loads to confirm', 'Full leaf height with no arching, the leaf densities, and any floor or roof load on the inner leaf. Enter floor or roof loads as extra dead or imposed load on the torsion beam.');
    $('tab-notes').innerHTML = `<div class="prose"><p>This page applies the method exactly as benchmarked, including the simplifications below. Each note shows its effect on the current design. IDs are the finding numbers from the validation study.</p></div><div class="notes">${N.join('')}</div>`;
  }

  // ------------------------------------------------------------------ Eurocode 3 path: beam-v03 engine + EN 1993 support checks
  const htmlText = s => new DOMParser().parseFromString(String(s), 'text/html').body.textContent || '';
  const v03Sym = s => String(s).replace(/_([A-Za-z0-9,.]+)/g, '_{$1}');
  function splitV03(name) {                                  // "LTB+torsion (EN 1993-6 Annex A)" / "Shear  V_Ed/V_c,Rd"
    let n = String(name), ref = '';
    const m = n.match(/^(.*?)\s*\((.*)\)\s*$/);
    if (m) { n = m[1]; ref = m[2]; }
    const i = n.indexOf('  ');
    if (i > 0) { ref = v03Sym(n.slice(i).trim()) + (ref ? ', ' + ref : ''); n = n.slice(0, i); }
    return [n.trim(), ref];
  }
  const endTorque = R => { const t = R.ch && R.ch.tor; return !t ? 0 : Math.abs(t.TEnds && t.TEnds.length ? +t.TEnds[0] : +t.TEd || 0); };
  function twistEC(p, R) {
    const t = R.ch && R.ch.tor, phi = !t ? 0 : Math.abs(+(t.p385 ? t.phiSerDeg : t.box ? t.phiDeg : 0) || 0);   // beam-v03's own SLS twist rule
    if (p.twist_check === 'Lever') { const d = p.h_d * phi / DEG; return { phi, value: d, lim: p.d_h_lim, u: d / p.d_h_lim }; }
    return { phi, value: phi, lim: p.phi_lim, u: phi / p.phi_lim };
  }
  function checkListEC(p, R) {
    const L = [], add = (name, ref, u) => L.push({ name, ref, u }), u = R.sup.util, m = p.sb_method;
    if (m === 'Plate') {
      add('Plate: bending at heel', 'EN 1993-1-1 6.2.5, M_{c,Rd} = W_{pl} f_{y} / γ_{M0}', u.heel);
      if ('transverse' in u) add('Plate: biaxial stress ratio', 'SCI P110 model with f_{y} / γ_{M0}', u.transverse);
      add('Plate: deflection at toe', 'δ ≤ 2 mm', u.toe);
      add('Plate: weld to beam', 'EN 1993-1-8 4.5.3.3', u.weld);
      if (p.con_stage) {
        add('Construction: bending at heel', '1.2 m high wall', u.heel_c);
        if ('transverse_c' in u) add('Construction: stress ratio', 'α_{lsc} ≤ α_{ts}', u.transverse_c);
        add('Construction: deflection at toe', 'δ_{c} ≤ 2 mm', u.toe_c);
      }
    } else {
      const nm = m === 'SCI' ? 'Stainless angle' : 'Angle';
      add(`${nm}: stress at heel`, m === 'SCI' ? 'EN 1993-1-4, σ ≤ f_{y} / γ_{M0}' : 'EN 1993-1-1, σ ≤ f_{y} / γ_{M0} (elastic)', u.heel);
      add(`${nm}: deflection at toe`, `δ ≤ ${f(R.sup.delta_lim, 2)} mm`, u.toe);
      if ('bolt' in u) {
        add('Bolt: shear and tension', 'EN 1993-1-8 Table 3.4', u.bolt);
        add('Bolt: combined', 'F_{v}/F_{v,Rd} + F_{t}/(1.4 F_{t,Rd}) ≤ 1', u.bolt_comb);
        add('Bolt: bearing on the angle', 'EN 1993-1-8 Table 3.4', u.bearing);
      } else add('Angle: weld', 'EN 1993-1-8 4.5.3.3', u.weld);
    }
    if (R.ch) {
      for (const x of R.ch.utils) {
        if (/^Deflection/.test(x.name)) continue;
        const [nm, ref] = splitV03(x.name);
        add('Beam: ' + nm, ref || 'beam-v03', x.val);
      }
      const tw = twistEC(p, R);
      if (p.twist_on !== 0) add(p.twist_check === 'Lever' ? 'Twist: movement at lever arm (SLS)' : 'Twist (SLS)',
        p.twist_check === 'Lever' ? `δ_{h} ≤ ${f(tw.lim, 1)} mm` : `φ ≤ ${f(tw.lim, 2)}° (project limit)`, tw.u);
      if (p.defl_on !== 0) add('Beam: deflection (SLS)', `min(L/${f(p.k_delta, 0)}, ${f(p.d_lim_abs, 1)} mm)`, (R.ch.dmax + p.d_add) / R.ch.dlimit);
    }
    return L;
  }
  function drawingInputEC(p, R) {
    const ld = lbl => (R.loads || []).find(l => l.label === lbl);
    const o = ld('outer leaf') || ld('slab edge on support'), i = ld('inner leaf') || ld('slab on beam');
    return { e0mb: R.mb ? R.mb.e0 : 0, dm: R.sup.dm, e1mb: o ? -o.e : 0, e2mb: i ? -i.e : 0 };
  }
  function updateEC(p, errs, warns) {
    const msgs = errs.map(t => ['err', t]).concat(warns.map(t => ['warn', t]));
    msgs.push(['info', 'Eurocode 3, UK NA. Beam checks: beam-v03 engine (torsion to SCI P385). Plate, angle, weld and bolt checks: verified by hand calculation only; this route has no external benchmark.']);
    let R = null;
    if (!errs.length) {
      try {
        if (isTor(st)) {
          const hit = EC3MS.find(st.mb_family, st.mb_name);
          R = EC3MS.run(p, { mb_family: st.mb_family, key: hit.key, name: hit.name, zgInner: st.zg_inner, gM0ss: +st.gm0ss });
          p.mb = R.mb;
          (R.ch.unsupported || []).forEach(t => msgs.push(['warn', 'beam-v03: ' + htmlText(t)]));
        } else R = { sup: EC3MS.supportOnly(p, { gM0ss: +st.gm0ss }) };
      } catch (e) { msgs.unshift(['err', `The calculation stopped: ${e.message}`]); R = null; }
    }
    $('msgs').innerHTML = msgs.map(([c, t]) => `<div class="msg ${c}">${mk(t)}</div>`).join('');
    if (!R) {
      $('verdict').className = 'verdict na';
      $('verdict').innerHTML = '<div class="state">Waiting</div><div><h2>Fix the inputs above to see results</h2></div>';
      return;
    }
    const checks = checkListEC(p, R), keys = [[p.sb_load === 'Slab' ? 'Slab edge load P₁ (ULS)' : 'Outer leaf load P₁ (ULS)', f(R.sup.P1, 2) + ' kN/m']];
    if (R.ch) {
      const tw = twistEC(p, R), an = R.ch.utils.find(x => /Annex A/.test(x.name));
      keys.push(['End torque T_Ed (ULS)', f(endTorque(R), 2) + ' kNm']);
      keys.push(['Twist φ (SLS)', f(tw.phi, 2) + '°']);
      keys.push(['Deflection δ_y (SLS)', f(R.ch.dmax + p.d_add, 2) + ' mm']);
      if (an) keys.push(['LTB + torsion', f(an.val, 3)]);
    } else {
      keys.push(['Stress at heel', f(R.sup.sigma_heel, 1) + ' N/mm²']);
      keys.push(['Toe deflection', f(R.sup.delta_toe, 2) + ' mm']);
    }
    renderVerdict(p, null, checks, keys);
    renderUtil(checks);
    renderDrawing(p, drawingInputEC(p, R));
    setPrintPage(null);
    renderSheetEC(p, R, checks);
    renderSectionEC(p, R);
    renderNotesEC(p, R);
  }

  function renderSheetEC(p, R, checks) {
    const out = [], tor = !!R.ch, m = p.sb_method, s = R.sup, u = s.util, bolt = p.fixing === 'Bolt', long = (p.orientation || 'Long') === 'Long';

    const R_ = (lb, sym, fx, val, unit) => out.push(`<div class="r"><div class="lb">${esc(lb)}</div><div class="ex">${sym ? mk(sym) + ' = ' : ''}${fx ? mk(fx) + ' = ' : ''}<span class="v">${val}</span>${unit ? ' ' + mk(unit) : ''}</div></div>`);
    const V = (lb, text) => out.push(`<div class="r"><div class="lb">${esc(lb)}</div><div class="ex">${mk(text)}</div></div>`);
    const C = (uu, okText, ngText) => { const k = state(uu); out.push(`<div class="ck ${k}"><span class="tag">${k === 'ok' ? 'PASS' : k === 'ng' ? 'FAIL' : 'N/A'}</span><span>${esc(k === 'ng' ? ngText : okText)}</span><span class="u">utilisation ${f(uu, 3)}</span></div>`); };
    const N = t => out.push(`<p class="nt">${mk(t)}</p>`);

    out.push(`<div class="tblock"><div><span>Project</span>${esc(st.project || '—')}</div><div><span>Job ref.</span>${esc(st.jobref || '—')}</div><div><span>Calc. by</span>${esc(st.calcby || '—')}</div><div><span>Date</span>${today}</div>` +
      `<div style="grid-column:1/-1"><span>Calculation</span>Steel masonry support to Eurocode 3 with the UK National Annexes: EN 1990, EN 1993-1-1, EN 1993-1-4, EN 1993-1-8${tor ? '; torsion beam to SCI P385 (beam-v03 engine)' : ''}. Support-member load models as SCI P110 / SCI P157.</div></div>`);

    H('Design basis');
    V('Combinations', `ULS: EN 1990 Eq 6.10, ${f(p.gG, 2)} G + ${f(p.gQ, 2)} Q. SLS: 1.0 G + 1.0 Q.`);
    V('Partial factors (UK NA)', `γ_{M0} = 1.0 (EN 1993-1-1), γ_{M2} = 1.25 (EN 1993-1-8)${m === 'SCI' ? `; stainless γ_{M0} = ${f(s.gM0ss, 2)} [verify against the UK NA to BS EN 1993-1-4]` : ''}`);
    V('Modulus of elasticity', m === 'SCI' ? 'E = 210000 N/mm² carbon steel; E = 200000 N/mm² austenitic stainless (EN 1993-1-4)' : 'E = 210000 N/mm²');

    H('Support member');

      R_('Yield strength (EN 10025-2, ' + p.grade_sb + ')', 'f_{y}', '', f(s.fy, 0), 'N/mm^2');
      R_('Length beyond the beam', 'l_{h}', '', f(p.lh, 0), 'mm'); R_('Total length', 'l_{plate}', '', f(p.lplate, 0), 'mm'); R_('Thickness', 't_{sb}', '', f(p.tsb, 1), 'mm');
    } else if (m === 'Cantilever') {
      const lh = long ? p.angle.D : p.angle.B, lv = long ? p.angle.B : p.angle.D;
      V('Masonry support angle', p.angle.name + ` (${p.grade_sb})`);
      R_('Yield strength (EN 10025-2)', 'f_{y}', '', f(s.fy, 0), 'N/mm^2'); R_('Tensile strength', 'f_{u}', '', f(s.fu, 0), 'N/mm^2');
      R_('Vertical leg', 'l_{v}', '', f(lv, 0), 'mm'); R_('Horizontal leg', 'l_{h}', '', f(lh, 0), 'mm'); R_('Thickness', 't_{sb}', '', f(p.angle.t, 1), 'mm');

      R_('Design strength', 'f_{y} / γ_{M0}', '', f(s.fyd, 0), 'N/mm^2');
      R_('Vertical leg', 'l_{v}', '', f(p.lv, 0), 'mm'); R_('Horizontal leg', 'l_{h}', '', f(p.lh, 0), 'mm'); R_('Thickness', 't_{sb}', '', f(p.tsb, 1), 'mm'); R_('Internal radius', 'r_{1sb}', '', f(p.r1sb, 1), 'mm');

    else if (tor) V('Inner leaf (on the beam)', `${f(p.b_mmb, 0)} mm × ${f(p.h_mmb, 0)} mm at ${f(p.rho_m_mb * 1e6, 1)} kN/m³; extra ${f(p.PGadd_mb, 2)} G + ${f(p.PQadd_mb, 2)} Q kN/m; e_{mb} = ${f(p.e_mb, 1)} mm`);

    } else {

        R_('Stress at the heel', 'σ', '6 P_{1} B_{bolt} (c − e_{mb} + e − s − 0.5 t_{sb}) / (B_{eff,str} t_{sb}^2)', f(s.sigma_heel, 1), 'N/mm^2');
      }

      if (bolt) {

        V('Bolts', `Grade ${p.bolt_grade}, ${p.bolt_size} at ${f(p.Bbolt, 0)} mm: f_{ub} = ${f(b.fub, 0)} N/mm², A_{s} = ${f(b.As, 1)} mm²`);

        C(u.bolt, 'Shear and tension resistances exceed the bolt forces', 'A bolt force exceeds its resistance');

        R_('Hole diameter (EN 1090-2 normal clearance)', 'd_{0}', '', f(b.d0, 0), 'mm');
        R_('', 'α_{b}', 'min(e_{b} / (3 d_{0}), f_{ub} / f_{u}, 1.0)', f(b.alphaB, 3), '');
        R_('', 'k_{1}', 'min(1.4 B_{bolt} / d_{0} − 1.7, 2.5)', f(b.k1, 2), '');
        if (m === 'SCI') R_('Reduced tensile strength for bearing (stainless) [verify]', 'f_{u,red}', '0.5 f_{y} + 0.6 f_{u} ≤ f_{u}', f(b.fuB, 0), 'N/mm^2');
        R_('Bearing resistance of the angle leg', 'F_{b,Rd}', 'k_{1} × α_{b} × f_{u} × d × t / γ_{M2}', f(b.FbRd / 1e3, 1), 'kN');
        C(u.bearing, 'Bearing resistance exceeds the bolt shear', 'Bolt shear exceeds the bearing resistance');
      } else {
        H('Weld to the beam', 'EN 1993-1-8 4.5.3.3 simplified method');
        R_('Resultant force per metre of angle', 'f', '(P_{1}^2 + (M_{1} / l)^2)^{0.5}', f(s.f_weld, 2), 'kN/m');
        R_('Weld length per metre', 'l_{weld}', '', f(p.l_weld * 1000, 0), 'mm/m');
        weldLines(s.weld, s.Fw_Ed, 'F_{w,Ed} = f / l_{weld}');
        C(u.weld, 'Weld resistance exceeds the design force', 'Design force exceeds the weld resistance');
      }
    }
    if (tor) {
      const G = p.gG, Q = p.gQ;
      H('Loads on the torsion beam', 'e from the shear centre, + inward (beam-v03 sign); z_{g} + above the shear centre (destabilising)');
      const rows = R.loads.map(l => `<tr><td>${esc(l.label)}</td><td>${l.case}</td><td class="n">${f(l.w, 3)}</td><td class="n">${f(l.e, 1)}</td><td class="n">${f(l.zg, 1)}</td></tr>`).join('') +
        `<tr><td>beam self-weight (beam-v03, automatic)</td><td>G</td><td class="n">${f(R.swKN, 3)}</td><td class="n">${f(R.swE, 1)}</td><td class="n">0.0</td></tr>`;
      out.push(`<div class="scroll"><table class="lt"><thead><tr><th>Load</th><th>Case</th><th class="n">w (kN/m)</th><th class="n">e (mm)</th><th class="n">z<sub>g</sub> (mm)</th></tr></thead><tbody>${rows}</tbody></table></div>`);
      const tq = R.loads.reduce((a, l) => a + (l.case === 'Q' ? Q : G) * l.w * l.e, 0) + G * R.swKN * R.swE;
      N(`Torque per metre at ULS (for information): T = Σ γ w e = ${f(tq / 1e3, 3)} kNm/m. Mirrored channel: ${R.mirror ? 'yes' : 'no'}. Shear centre ${f(Math.abs(R.dsc), 1)} mm ${R.dsc < 0 ? 'outside' : 'inside'} the beam's outer face.`);
      H('Torsion beam design', 'beam-v03 engine (EN 1993-1-1, EN 1993-1-5, SCI P385); the report below is beam-v03\'s own');
      out.push(`<div class="v03">${EC3MS.brief(R)}</div>`);
      const tw = twistEC(p, R);
      H('Serviceability limits of this design', (p.twist_on === 0 ? 'twist check switched off; ' : '') + (p.defl_on === 0 ? 'deflection check switched off' : ''));
      R_('Maximum twist at SLS (beam-v03)', 'φ_{sls}', '', f(tw.phi, 2), '°');
      if (p.twist_check === 'Lever') { R_('Movement at the lever arm', 'δ_{h}', 'h_{δ} × φ_{sls}', f(tw.value, 2), 'mm'); R_('Limit', 'δ_{h,lim}', '', f(tw.lim, 1), 'mm'); }
      else R_('Twist limit (project criterion; SCI P385 suggests about 2°)', 'φ_{lim}', '', f(tw.lim, 2), '°');
      C(tw.u, 'Twist within the limit', 'Twist exceeds the limit');
      R_('Maximum deflection at SLS (beam-v03)', 'δ_{y}', '', f(R.ch.dmax, 2), 'mm');
      if (p.d_add) R_('Additional deflection', 'δ_{add}', '', f(p.d_add, 2), 'mm');
      R_('Deflection limit', 'δ_{lim}', 'min(L / k_{δ}, δ_{lim,abs})', f(R.ch.dlimit, 2), 'mm');
      C((R.ch.dmax + p.d_add) / R.ch.dlimit, 'Deflection within the limit', 'Deflection exceeds the limit');
    }
    const bad = checks.filter(c => state(c.u) === 'ng');
    H('Summary');
    N(bad.length ? `${bad.length} of ${checks.length} checks fail: ${bad.map(c => `${c.name} (${f(c.u, 2)})`).join('; ')}.` : `All ${checks.length} checks pass.`);
    $('tab-sheet').innerHTML = out.join('');
  }

  function renderSectionEC(p, R) {
    const rows = [], T = (a, b, c) => rows.push(`<tr><td>${mk(a)}</td><td class="n">${b}</td><td>${mk(c || '')}</td></tr>`);
    let html = '';
    if (R.ch) {
      const sec = R.sec, tp = sec.tp || {}, box = sec.kind === 'box';
      T('Section', esc(R.mb.name)); T('Source', 'beam-v03 library (SCI P363 section tables; SCI P385 torsion constants)');
      T('Depth h', f(+sec.D, 1), 'mm'); T('Width b', f(+sec.B, 1), 'mm'); T(box ? 'Wall thickness t' : 'Web t_{w}', f(+sec.tw, 2), 'mm');
      if (!box) { T('Flange t_{f}', f(+sec.tf, 2), 'mm'); T('Root radius r', f(+sec.r, 1), 'mm'); }
      T('Mass', f(+sec.mass, 1), 'kg/m'); T('Area A', f(+sec.A, 2), 'cm^2');
      T('I_{y}', f(+sec.Ix, 0), 'cm^4'); T('I_{z}', f(+sec.Iy, 1), 'cm^4');
      T('W_{el,y}', f(+sec.Zx, 1), 'cm^3'); T('W_{pl,y}', f(+sec.Sx, 1), 'cm^3'); T('W_{el,z}', f(+sec.Zy, 1), 'cm^3'); T('W_{pl,z}', f(+sec.Sy, 1), 'cm^3');
      T('Torsion constant I_{T}', f(tp.IT != null ? +tp.IT : +sec.J, 2), 'cm^4');
      if (tp.Iw != null) T('Warping constant I_{w}', f(+tp.Iw, 4), 'dm^6');
      if (sec.kind === 'channel') { T('Shear centre from the web centreline e_{0}', f(+tp.e0, 1), 'mm'); T('Shear centre to centroid e_{sc}', f(+tp.esc, 1), 'mm'); }
      if (tp.Wn0 != null) T('Normalised warping function W_{n0}', f(+tp.Wn0, 1), 'cm^2');
      if (tp.Sw1 != null) T('Warping statical moment S_{w1}', f(+tp.Sw1, 1), 'cm^4');
      if (tp.Wt != null) T('Torsion modulus W_{t}', f(+tp.Wt, 1), 'cm^3');
      T('Yield strength f_{y} (beam-v03)', f(+R.ch.fy, 0), 'N/mm^2');
      T('Cross-section class (beam-v03)', esc(String(R.ch.clsName || (R.ch.cl && R.ch.cl.cls) || '')));
      html += `<h3 class="sh-h">Torsion beam</h3><div class="scroll"><table><tbody>${rows.join('')}</tbody></table></div>`;
      rows.length = 0;
    }
    if (p.sb_method === 'Cantilever') {
      const a = p.angle, long = (p.orientation || 'Long') === 'Long';
      T('Angle', esc(a.name)); T('Legs D × B × t', `${f(a.D, 0)} × ${f(a.B, 0)} × ${f(a.t, 1)}`, 'mm'); T('Area A', f(a.A / 100, 2), 'cm^2');
      T('Centroid from the back of the vertical leg', f(long ? a.cx : a.cyy, 1), 'mm'); T('Centroid above the soffit', f(long ? a.cyy : a.cx, 1), 'mm');
      html += `<h3 class="sh-h">Support angle</h3><div class="scroll"><table><tbody>${rows.join('')}</tbody></table></div>`;
    } else if (p.sb_method === 'SCI') {
      T('Legs l_{h} × l_{v} × t', `${f(p.lh, 0)} × ${f(p.lv, 0)} × ${f(p.tsb, 1)}`, 'mm'); T('Inside bend radius r_{1}', f(p.r1sb, 1), 'mm');
      T('0.2 % proof strength f_{y}', f(R.sup.fy, 0), 'N/mm^2'); T('Tensile strength f_{u}', f(R.sup.fu, 0), 'N/mm^2');
      html += `<h3 class="sh-h">Stainless angle</h3><div class="scroll"><table><tbody>${rows.join('')}</tbody></table></div>`;
    } else {
      T('Plate l_{plate} × t_{sb}', `${f(p.lplate, 0)} × ${f(p.tsb, 1)}`, 'mm'); T('Yield strength f_{y}', f(R.sup.fy, 0), 'N/mm^2');
      html += `<h3 class="sh-h">Support plate</h3><div class="scroll"><table><tbody>${rows.join('')}</tbody></table></div>`;
    }
    $('tab-section').innerHTML = html;
  }

  function renderNotesEC(p, R) {
    const N = [], tor = !!R.ch, m = p.sb_method;
    const add = (id, lvl, title, body) => N.push(`<div class="note ${lvl}"><h4><span class="id">${id}</span>${esc(title)}</h4><p>${body}</p></div>`);
    add('E1', 'info', 'What changes from the BS 5950 route', 'Loads use EN 1990 Eq 6.10. The beam is checked by beam-v03: EN 1993-1-1 cross-section and lateral-torsional buckling with an FE eigenvalue M<sub>cr</sub> that includes the load heights, and SCI P385 for torsion (cross-section check to P385 3.1.2 and the EN 1993-6 Annex A buckling interaction). The plate, angle, weld and bolt checks keep the SCI P110 / SCI P157 load models of the BS route with EN 1993 resistances.');
    if (tor) {
      const tw = twistEC(p, R);
      add('E2', 'warn', 'Twist limit is a project criterion', `Eurocode 3 sets no twist limit; SCI P385 suggests about 2° as a guideline. This page applies your limit (${p.twist_check === 'Lever' ? f(p.d_h_lim, 1) + ' mm at the lever arm' : f(p.phi_lim, 2) + '°'}); the SLS twist is ${f(tw.phi, 2)}°. For masonry, the drop of the outer leaf bearing usually governs.`);
      add('E3', 'info', 'Load height', `The inner leaf load is applied at ${st.zg_inner === 'sc' ? 'the shear centre (not destabilising)' : 'the top flange (destabilising)'} and the outer leaf at the support level (stabilising). Change “Inner leaf load acts at” if the wall restrains the top flange.`);
      if (R.mb.type === 'C') add('E4', 'info', 'Channel self-weight torque included', `beam-v03 applies the channel's self-weight at its centroid, ${f(Math.abs(R.swE), 1)} mm from the shear centre. The BS route leaves this torque out (finding F2).`);
      const toe = m === 'Plate' ? p.lh : (m === 'Cantilever' ? ((p.orientation || 'Long') === 'Long' ? p.angle.D : p.angle.B) : p.lh) + (p.fixing === 'Bolt' ? p.shim : 0);
      const lever = toe + R.dsc, drop = R.ch.dmax + p.d_add + tw.phi / DEG * lever + R.sup.delta_toe;
      add('F4', 'info', 'Total drop of the outer-leaf bearing', `At midspan, toe of the support: δ<sub>y</sub> + φ<sub>sls</sub> × ${f(lever, 0)} mm + δ<sub>toe</sub> = <b>${f(drop, 1)} mm</b>. Compare with what the masonry and its movement joints can accept.`);
      add('F6', 'warn', 'End connections must carry the torque', `beam-v03 gives T<sub>Ed</sub> = <b>${f(endTorque(R), 2)} kNm</b> at each end (ULS, fork supports). Design the end connections for it.`);
      add('E5', 'info', 'Stiff bearing at the supports', 'beam-v03 checks the web under the support reactions with a 100 mm stiff bearing length at each end. Change the detail or check it separately if the bearing is shorter.');
      if (R.mirror) add('M1', 'warn', 'Mirrored channel', 'The toes face the cavity, so the shear centre lies on the inner side and both leaves twist the beam the same way. Keep the toes inward unless there is a strong reason.');
    }
    if ((m === 'Plate' || (m === 'Cantilever' && p.fixing === 'Weld top')) && R.sup.weld) add('E6', 'info', 'Weld strength from the weaker part', `f<sub>u</sub> and β<sub>w</sub> come from the weaker part joined (${esc(R.sup.weld.grade)}), as EN 1993-1-8 4.5.3.3 requires. The BS route uses the support grade only (finding F12).`);
    if (m === 'Plate') {
      add('E7', 'info', 'Plastic resistance of the plate', 'EN 1993-1-1 takes M<sub>c,Rd</sub> = W<sub>pl</sub> f<sub>y</sub> / γ<sub>M0</sub> for the Class 1 plate strip, 25 % more than the BS 5950 limit of 1.2 p<sub>y</sub> Z. The toe deflection limit still controls the plate stiffness.');
      if (R.sup.dm < 2 / 3 * p.b_msb && p.sb_load !== 'Slab') add('F13', 'warn', 'Less than 2/3 bearing', `d<sub>m</sub> = ${f(R.sup.dm, 1)} mm is below 2/3 of the leaf width (${f(2 / 3 * p.b_msb, 1)} mm).`);
    }
    if (m === 'Cantilever') add('E8', 'info', 'Angle self-weight lever', `The self-weight of the angle acts at its true centroid, ${f((p.orientation || 'Long') === 'Long' ? p.angle.cx : p.angle.cyy, 1)} mm from the back of the vertical leg (the BS route uses c<sub>yy</sub> for either orientation, finding F14).`);
    if (p.fixing === 'Bolt') add('E9', 'info', 'Bolt bearing added', 'The bearing resistance of the angle leg around each bolt (EN 1993-1-8 Table 3.4) is checked here; the BS route has no bearing check.');
    if (m === 'SCI') add('E10', 'warn', 'Stainless partial factor', `γ<sub>M0</sub> = ${f(+st.gm0ss, 2)} is used for the stainless angle (EN 1993-1-4 recommends 1.1). Confirm the value in the UK National Annex to BS EN 1993-1-4, and the reduced strength f<sub>u,red</sub> used for bolt bearing.`);
    add('F11', 'info', 'Loads to confirm', 'Full leaf height with no arching, the leaf densities, and any floor or roof load on the inner leaf (enter it as extra dead or imposed load).');
    $('tab-notes').innerHTML = `<div class="prose"><p>Eurocode 3 route. Each note shows its effect on the current design; F-numbers refer to the findings on the BS route.</p></div><div class="notes">${N.join('')}</div>`;
  }

  // ------------------------------------------------------------------ validation against the embedded benchmark runs
  function refUtils(r, p, o) {
    const u = {};
    if (p.sb_method === 'Plate') {
      u.heel = r.Mx_plate / o.Mc_plate; u.transverse = r.alpha_ts > 0 ? r.alpha_ls / r.alpha_ts : Infinity; u.toe = r.delta_toe / o.delta_lim; u.weld = r.Rweld / r.pc_weld;   // toe limit min(1 + dm/c, 2) mm (live run V1)
    } else {
      u.heel = r.sigma_heel / o.pysb;
      if ('delta_toe' in r) u.toe = r.delta_toe / o.delta_lim;     // not compared where the benchmark overwrites δ (welded angle, construction stage)
      if (p.fixing === 'Bolt') { u.bolt = Math.max(r.Fs_bolt / r.Ps_bolt, r.Ft_bolt / r.Pt_bolt); u.bolt_comb = r.F_comb / 1.4; }
      else u.weld = r.P_weld / o.pweld;
    }
    if (p.mb) {
      const py = o.py, hr = p.mb.type === 'HR';
      u.shear = r.Fv / r.Pv; u.moment = r.Mx / r.Mcx; u.buckling_ib = r.ib;
      if (hr) { u.local = (r.sig_bx + r.sig_byt) / py; u.shear_stress = r.tau / (0.6 * py); }
      else { u.LTB = r.Mx * p.mLT / r.Mb; u.local = (r.sig_bx + r.sig_byt + r.sig_w) / py; u.shear_stress = Math.max(r.tau_w, r.tau_f) / (0.6 * py); }
      if (p.twist_on !== 0) u.twist = p.twist_check === 'Lever' ? r.delta_h_sls / p.d_h_lim : r.phi_sls_deg / p.phi_lim;
      if (p.defl_on !== 0) u.deflection = r.dy / Math.min(p.L / p.k_delta, p.d_lim_abs);
    }
    return u;
  }
  function engineUtils(p, o) {
    const u = Object.assign({}, o.util_sb);
    delete u.heel_c; delete u.transverse_c; delete u.toe_c;
    if (o.util) { Object.assign(u, o.util); if (p.mb.type === 'HR') delete u.LTB; }
    return u;
  }
  let VAL = null;
  function runValidation() {
    let n = 0, within = 0, worst = 0, worstAt = '', sum = 0, dec = 0, decOk = 0, cls = 0, clsOk = 0;
    const rows = [];
    for (const c of DATA.cases) {
      let o;
      try { o = SMS.calc(c.p); } catch (e) { rows.push({ c, err: e.message }); continue; }
      let w = 0, wk = '', cn = 0;
      for (const [k, ref] of Object.entries(c.refs)) {
        if (k === 'Class') { cls++; if (String(o.Class).toLowerCase() === String(ref).toLowerCase()) clsOk++; continue; }
        const e = Math.abs(o[k] - ref) / Math.max(Math.abs(ref), 1e-9);
        n++; cn++; sum += e; if (e <= 0.02) within++;
        if (!(e <= w)) { w = e; wk = k; }
      }
      if (!(w <= worst)) { worst = w; worstAt = `${c.id} ${wk}`; }
      const tu = refUtils(c.refs, c.p, o), eu = engineUtils(c.p, o);
      let cd = 0, cdOk = 0;
      for (const k of Object.keys(tu)) { cd++; if ((tu[k] <= 1) === (eu[k] <= 1)) cdOk++; }
      dec += cd; decOk += cdOk;
      rows.push({ c, o, w, wk, cn, cd, cdOk });
    }
    VAL = { rows, n, within, worst, worstAt, mean: n ? 1 - sum / n : 0, dec, decOk, cls, clsOk };
    const chip = $('vchip'), good = within === n && decOk === dec && rows.every(r => !r.err);
    chip.classList.toggle('bad', !good);
    chip.innerHTML = `Verified on <b>${rows.length}</b> benchmark runs · max difference <b>${pct(worst)}</b>`;
    renderValidation();
  }
  function renderValidation() {
    const V = VAL, gui = V.rows.filter(r => /^[CX]/.test(r.c.id)).length;
    const desc = r => {
      const p = r.c.p, sup = p.sb_method === 'Plate' ? `${f(p.tsb, 0)} mm plate` : p.sb_method === 'Cantilever' ? `${p.angle.name} ${p.fixing === 'Bolt' ? 'bolted' : 'welded'}` : `stainless ${p.grade_sb} angle`;
      return (p.mb ? p.mb.name + ' + ' : '') + sup;
    };
    const rows = V.rows.map(r => r.err ? `<tr><td>${r.c.id}</td><td colspan="5">Engine error: ${esc(r.err)}</td></tr>` :
      `<tr><td>${r.c.id}</td><td>${esc(r.c.src)}</td><td>${esc(desc(r))}${r.c.desc ? `<span class="ref">${esc(r.c.desc)}</span>` : ''}</td>` +
      `<td class="n">${r.cn}</td><td class="n">${pct(r.w)}<span class="ref">${esc(r.wk)}</span></td><td class="n">${r.cdOk}/${r.cd}</td>` +
      `<td><button type="button" class="btn" data-load="${r.c.id}">Load</button></td></tr>`).join('');
    $('tab-validation').innerHTML = `<div class="prose"><p>Every run below was calculated by an established commercial program for this calculation (same BS 5950 method). ${gui} were run in its window and ${V.rows.length - gui} through its calculation interface, with sections, angles and bolts from its data lists. When this page opens, its engine recalculates every run from the same inputs and compares each result.</p></div>` +
      `<dl class="stats"><div><dt>Benchmark runs</dt><dd>${V.rows.length}</dd></div><div><dt>Values compared</dt><dd>${V.n}</dd></div><div><dt>Within 2 %</dt><dd>${V.within} / ${V.n}</dd></div>` +
      `<div><dt>Largest difference</dt><dd>${pct(V.worst)}</dd></div><div><dt>Mean accuracy</dt><dd>${(100 * V.mean).toFixed(4)} %</dd></div><div><dt>Pass/fail verdicts agree</dt><dd>${V.decOk} / ${V.dec}</dd></div><div><dt>Section class agrees</dt><dd>${V.clsOk} / ${V.cls}</dd></div></dl>` +
      `<div class="prose"><p><b>Covered:</b> the six worked examples (X01–X06); eight live verification runs (V1–V8: every support and beam check failing, high shear on I and RHS beams, all five Table 13 rows, an RHS beyond the Table 15 limit, a channel with slabs); welded plate, hot-rolled angle welded or bolted (either leg horizontal), angle only, cold-formed stainless angle; masonry or slab on the support and on the beam; angle soffit offset h<sub>bf</sub>; UKPFC, UKB, UKC, RHS and SHS beams up to UKB 1016; plastic, compact and semi-compact beams and high-shear moment capacity (slender beams stop as “beyond scope”); warping free and fixed; normal and destabilising load; Table 13 factors; angle and lever-arm twist limits, and the twist or deflection check switched off; plate construction stage; grade 4.6 and 8.8 bolts M12–M24; S275 and S355. <b>Not yet benchmarked:</b> HSFG bolts, laterally unrestrained compression flanges, and user-defined sections (their properties come from the dimensions, checked against 141 catalogue sections to 0.04 %). The construction stage with angles is not offered: for a welded angle the benchmark program overwrites its toe deflection with the construction-stage value, so that value is not compared (runs M038 and M039).</p></div>` +
      `<div class="scroll"><table><thead><tr><th>Run</th><th>Source</th><th>Case</th><th class="n">Values</th><th class="n">Largest diff.</th><th class="n">Verdicts</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` +
      (DATA.ec3test ? `<div class="prose"><h3>Eurocode 3 mode</h3><p>This mode has no external benchmark. ` +
        `The beam checks are beam-v03's engine (commit ${esc(DATA.ec3test.commit)}), included unchanged; beam-v03 was benchmarked against commercial beam-design software and checks torsion to SCI P385. ` +
        `The adapter that turns this page's inputs into beam-v03 loads was checked against beam-v03's own Beam in Wall module on the same wall: identical load positions, load heights and results. ` +
        `The plate, weld and bolt formulas (EN 1993-1-1, EN 1993-1-8) were checked against hand calculations. Build test output:</p>` +
        `<pre class="nt" style="white-space:pre-wrap;font-family:var(--font-num);font-size:12px">${esc(DATA.ec3test.lines.join('\n'))}</pre></div>` : '');
  }
  $('tab-validation').addEventListener('click', e => {
    const b = e.target.closest('button[data-load]');
    if (b) { loadCase(b.dataset.load); selectTab('sheet'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });

  // ------------------------------------------------------------------ presets, tabs, boot
  function loadCase(id) {
    const c = DATA.cases.find(x => x.id === id);
    if (!c) return;
    st = pToForm(c.p);
    if (isEC(st) && +st.gG === 1.4 && +st.gQ === 1.6) { st.gG = 1.35; st.gQ = 1.5; }
    fixSection();
    writeForm();
    update();
    const sel = $('preset');
    sel.value = [...sel.options].some(o => o.value === id) ? id : '';
    tip(sel);
  }
  function buildPresets() {
    const sel = $('preset');
    const blank = document.createElement('option'); blank.value = ''; blank.textContent = 'Your inputs'; sel.append(blank);
    for (const [label, pre] of [['Worked examples', 'X'], ['Verification runs', 'V'], ['Benchmark runs', 'C']]) {
      const og = document.createElement('optgroup'); og.label = label;
      for (const c of DATA.cases.filter(x => x.id.startsWith(pre))) {
        const o = document.createElement('option'); o.value = c.id;
        o.textContent = `${c.id}: ${c.short || c.desc}`; o.title = c.desc; og.append(o);
      }
      if (og.children.length) sel.append(og);
    }
    sel.addEventListener('change', () => { if (sel.value) loadCase(sel.value); tip(sel); });
  }
  const TABS = ['sheet', 'section', 'validation', 'notes'];
  function selectTab(name) {
    for (const t of TABS) { $('t-' + t).setAttribute('aria-selected', String(t === name)); $('tab-' + t).hidden = t !== name; }
  }
  $('tabs').addEventListener('click', e => { const b = e.target.closest('button[role=tab]'); if (b) selectTab(b.id.slice(2)); });
  $('tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = TABS.findIndex(t => $('t-' + t).getAttribute('aria-selected') === 'true'), j = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
    selectTab(TABS[j]); $('t-' + TABS[j]).focus();
  });
  $('vchip').addEventListener('click', () => { selectTab('validation'); $('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); });

  buildForm();
  buildPresets();
  const hasC01 = DATA.cases.some(c => c.id === 'C01');
  if (hasC01) loadCase('C01'); else { writeForm(); update(); }
  runValidation();
  const h = (location.hash || '').slice(1), hc = /(?:^|&)case=([A-Za-z0-9]+)/.exec(h), ht = /(?:^|&)tab=([a-z]+)/.exec(h);
  for (const k of ['project', 'jobref', 'calcby', 'company', 'address', 'section', 'calcdate', 'chkby', 'chkdate', 'appby', 'appdate', 'paper']) {   // optional sheet heading from the link, e.g. #case=X01&company=...
    const mh = new RegExp('(?:^|&)' + k + '=([^&]*)').exec(h);
    if (mh) { try { st[k] = decodeURIComponent(mh[1].replace(/\+/g, ' ')); } catch (e) { /* keep the form value */ } }
  }
  if (hc) loadCase(hc[1]);                                   // e.g. #case=X01 (used to print the comparison reports)
  if (TABS.includes(h)) selectTab(h); else if (ht && TABS.includes(ht[1])) selectTab(ht[1]);
  $('foot').textContent = `Engine sms.js ${SMS.version}. Page built ${DATA.built}. Sections: ${Object.entries(CAT).map(([k, v]) => `${v.length} ${k}`).join(', ')}. ` +
    'Results are for checking by a competent engineer, who remains responsible for the design.';
})();
</script>
